function teacher(){

 if(!door)return;
 const correct=(world+level+Math.floor(door.x/700))%STAFF_MYSTERIES.length;
 const mystery=STAFF_MYSTERIES[correct];
 sound('knock');
 show('🚪 Knock, Knock!','You hear footsteps on the other side of the door…',p=>{
   const scene=document.createElement('div');scene.style.cssText='font-size:64px;margin:8px';scene.textContent='🚪 ✨';p.append(scene);
   p.append(button('🍬 TRICK OR TREAT!',()=>startTeacherGuess(door,mystery,correct)));

function startTeacherGuess(door,mystery,correct){

 const shuffled=STAFF_MYSTERIES.map((s,i)=>({s,i,order:rand(seed+i*61)})).sort((a,b)=>a.order-b.order);
 function render(){
   show('🎭 Who Is Behind the Costume?',`“Happy Halloween! I'm dressed as ${mystery.costume}. Can you guess who I am?”`,p=>{
     const costume=document.createElement('div');costume.style.cssText='font-size:72px;line-height:1.3;margin:4px';costume.textContent=['🦸','🧙','🎃','🐉'][correct];p.append(costume);
     const clue=document.createElement('p');clue.style.cssText='font-weight:900;background:#ffffff14;border:1px solid #ffffff38;border-radius:14px;padding:12px';clue.textContent='🔎 CLUE '+(hint+1)+': '+mystery.clues[hint];p.append(clue);
     const choices=document.createElement('div');choices.className='teacher-choice';
     shuffled.forEach(o=>choices.append(button(o.s.role,()=>{
       if(o.i===correct){
         door.done=true;sound('correct');
         const prize=Math.max(10,30-tries*5-hint*3);
         awardCandy(prize);clueSet.add(door.id);save();ui();
         show('🍬 TRICK OR TREAT! 🍬',mystery.reveal,p2=>{
           const photo=document.createElement('div');photo.style.cssText='font-size:60px';photo.textContent=mystery.emoji+' 🎉';p2.append(photo);
           const reward=document.createElement('p');reward.style.cssText='font-size:23px;color:#ffe18c;font-weight:900';reward.textContent='+'+prize+' CANDY!';p2.append(reward);
           const secret=document.createElement('p');secret.textContent='🔍 MYSTERY CLUE: '+mystery.secret;p2.append(secret);
           const note=document.createElement('p');note.className='note';note.textContent='Staff roles are placeholders until verified Gilbert staff names and approved photos are added.';p2.append(note);
           p2.append(button('Collect Candy & Continue →',hide));
         });
       }else{
         tries++;sound('wrong');
         if(hint<2)hint++;
         render();
         const warning=document.createElement('p');warning.style.cssText='color:#ffce87;font-weight:bold';warning.textContent='Not quite! Here is another clue. Try again!';panel.insertBefore(warning,panel.lastChild);
       }
     })));
     p.append(choices);
     if(hint<2)p.append(button('💡 Get another clue (-3 bonus candy)',()=>{hint++;render()},'minor'));

     const note=document.createElement('p');note.className='note';note.textContent='Guess correctly to collect candy and a clue to the Golden Gator mystery. The answer choices are shuffled.';p.append(note);
   });
 }
 render();
}

function finish(){

 else {progress[world]=3;unlocked=Math.max(unlocked,Math.min(5,world+1))}
 save();ui();
 show(level===2?'🏆 World Complete!':'⭐ Level Complete!',`Great jumping! You earned 50 bonus candy. ${level===2?'The next world is now unlocked!':'Ready for the next level?'}`,p=>{
  if(level===2){
   if(world<5)p.append(button('Next world →',()=>{world++;level=Math.min(2,progress[world]||0);start()}));

  }else p.append(button('Next level →',()=>{level++;start()}));

}function safeCheckpoint(x){
 const solid=platforms.filter(p=>p.y===465&&p.h>=60&&p.kind!=="crumble"&&p.w>=100&&p.x+p.w>80&&p.x<levelEnd-65);
 const candidates=solid.map(p=>Math.max(p.x+35,Math.min(x,p.x+p.w-35))).filter(v=>v>=80);
 return candidates.length?candidates.reduce((a,b)=>Math.abs(b-x)<Math.abs(a-x)?b:a):80;
}

    round(x-21,y-tall,42,tall,12,'#4a5363');

   }

  }
  // Broken wrought-iron fence, behind the playable terrain.
  for(let i=-2;i<Math.ceil(levelEnd/190)+4;i++){
   const x=i*190;rect(x,407,5,57,'#303b4b');
   for(let k=0;k<7;k++){let px=x+k*29;rect(px,421,3,43,'#303b4b');
    ctx.fillStyle='#49536a';ctx.beginPath();ctx.moveTo(px-4,421);ctx.lineTo(px+1,412);ctx.lineTo(px+6,421);ctx.fill()}
   rect(x,432,190,4,'#354253');rect(x,451,190,4,'#354253');
  }
 }
 ctx.restore();
 // A few drifting wisps stay in the screen plane, independent of player position.
 for(let i=0;i<6;i++){
  let x=(i*211+frame*.22+world*39)%(W+280)-140;
  ellipse(x,378+(i%3)*32+Math.sin(frame*.011+i)*8,90,15,'#c9e9e71b');
 }
}
function draw(){ctx.setTransform(1,0,0,1,0,0);rect(0,0,C.width,C.height,'#0c0e22');ctx.setTransform(scale,0,0,scale,ox,oy);backdrop();atmosphereDetails();drawSpookyLandscape();ctx.save();ctx.translate(-camera,0);for(const d of decor){if(d.x<camera-100||d.x>camera+W+100)continue;let y=450;if(d.type===0){ellipse(d.x,y,24,21,'#df7e35');text('◡',d.x,y+5,20,'#43213a')}else if(d.type===1){text('🕸',d.x,y-35,32)}else if(d.type===2){text('🍂',d.x,y-8,20)}else if(d.type===3){round(d.x-3,y-26,7,26,3,'#674d71');ellipse(d.x,y-28,15,12,'#ffd06a')}else text('✦',d.x,y-18,17,'#ffc778')}drawForestObstacles();for(const p of platforms)if(p.x+p.w>camera-50&&p.x<camera+W+50)drawPlatform(p);for(const d of doors){if(d.x<camera-80||d.x>camera+W+80)continue;round(d.x-28,d.y-30,56,90,5,d.done?'#4b9e7c':'#9a5c68');round(d.x-21,d.y-22,42,75,3,'#4a3568');round(d.x-13,d.y-11,26,26,4,'#ffe4a8');ellipse(d.x+12,d.y+32,4,4,'#ffd26b');text(d.done?'✓':'?',d.x,d.y+7,23,'#61335d');if(!d.done&&Math.abs(player.x-d.x)<95&&Math.abs(player.y-d.y)<130){round(d.x-80,d.y-70,160,29,10,'#fff3ca');text('E / TREAT TO KNOCK',d.x,d.y-50,13,'#35254e')}}for(const b of powerBoxes){if(b.x<camera-60||b.x>camera+W+60)continue;
 const y=b.y-(b.bump>0?Math.sin(b.bump*.35)*5:0);
 round(b.x-23,y,46,40,7,b.used?'#5c5477':'#f4aa36');round(b.x-19,y+4,38,31,5,b.used?'#746c88':'#ffd56b');

}for(const c of candies)if(!c.taken&&c.x>camera-50&&c.x<camera+W+50){let y=c.y+Math.sin(frame*.06+c.phase)*5;ellipse(c.x,y,13,13,'#ffd062');ellipse(c.x,y,8,8,'#fff2a8');text('★',c.x,y+5,16,'#e89c36')}for(const g of ghosts){if(boss&&g.x>levelEnd-820)continue;if(g.x<camera-80||g.x>camera+W+80)continue;let x=g.x,y=g.y;ellipse(x,y,23,25,'#e3f8f4');rect(x-22,y,44,16,'#e3f8f4');ellipse(x-15,y+15,8,10,'#e3f8f4');ellipse(x+15,y+15,8,10,'#e3f8f4');ellipse(x-8,y-2,4,6,'#35345d');ellipse(x+8,y-2,4,6,'#35345d');ellipse(x,y+9,5,4,'#bd75b7')}for(const w of witches)if(w.alive&&w.x>camera-100&&w.x<camera+W+100&&(!boss||w.x<levelEnd-850)&&!doors.some(d=>Math.abs(w.x-d.x)<280))drawWitch(w);for(const z of zombies)if(z.alive&&z.x>camera-80&&z.x<camera+W+80&&(!boss||z.x<levelEnd-850)&&!doors.some(d=>Math.abs(z.x-d.x)<250))drawZombie(z);for(const m of monsters)if(m.alive&&m.x>camera-90&&m.x<camera+W+90&&!doors.some(d=>Math.abs(m.x-d.x)<250))drawMonster(m);for(const e of throwers)if((!boss||e.x<levelEnd-820)&&e.x>camera-80&&e.x<camera+W+80)drawThrower(e);for(const b of projectiles)if(b.x>camera-40&&b.x<camera+W+40)drawPumpkinShot(b);for(const b of magicShots)if(b.x>camera-40&&b.x<camera+W+40){ellipse(b.x,b.y,16,16,'#8ef9ff');text('✦',b.x,b.y+7,24,'#fff9a3')}for(const p of particles)ellipse(p.x,p.y,3,3,'#ffe87e');drawBoss();round(levelEnd-58,318,10,150,3,'#fff0b4');text('🏁',levelEnd-34,332,49);drawGator();ctx.restore();weatherOverlay();cinematicLighting();if(mode==='play'){text(`LEVEL ${level+1}/3 • ${currentWeather().toUpperCase()} • ✨ ${magicCharges} THROWS`,W/2,45,19,'#ffe1a1');if(costumeTimer>0)text('🎭 '+costume.toUpperCase()+' • '+Math.ceil(costumeTimer/60)+'s LEFT',W/2,72,16,'#c8fff5');if(powerMessage>0)text('🎭 '+costume.toUpperCase()+' COSTUME!',W/2,111,22,'#ffeb80');if(doors.some(d=>!d.done&&Math.abs(player.x-d.x)<95&&Math.abs(player.y-d.y)<130))text('🚪 KNOCK: E OR TREAT',W/2,85,17,'#fff5b4')}}
let last=0;function loop(t){let dt=Math.min(3,Math.max(1,Math.round((t-last)/16.67)||1));last=t;for(let i=0;i<dt;i++)update();draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();if(['ArrowLeft','KeyA'].includes(e.code))keys.left=true;if(['ArrowRight','KeyD'].includes(e.code))keys.right=true;if(['ArrowUp','Space','KeyW'].includes(e.code))keys.jump=true;if(e.code==='KeyE'&&mode==='play')teacher();if(e.code==='KeyF'&&mode==='play')throwMagic();if(e.code==='Escape'&&mode==='play')show('⏸ Paused','Take a candy break!',p=>{p.append(button('Resume',hide));p.append(button('World Map',menu,'minor'))})});addEventListener('keyup',e=>{if(['ArrowLeft','KeyA'].includes(e.code))keys.left=false;if(['ArrowRight','KeyD'].includes(e.code))keys.right=false;if(['ArrowUp','Space','KeyW'].includes(e.code))keys.jump=false});document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;for(const ev of ['pointerdown'])b.addEventListener(ev,e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,e=>{e.preventDefault();keys[k]=false})});document.getElementById('interact').onclick=()=>{if(mode==='play')teacher()};document.getElementById('blast').onclick=throwMagic;addEventListener('blur',()=>{keys.left=keys.right=keys.jump=false});ui();menu();})();
