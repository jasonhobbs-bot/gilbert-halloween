function tone(note,duration=.16,type='triangle',volume=.16,when=0){if(!audio||!master||!musicEnabled)return;let now=audio.currentTime+when;let osc=audio.createOscillator(),gain=audio.createGain();osc.type=type;osc.frequency.setValueAtTime(440*Math.pow(2,(note-69)/12),now);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(Math.max(.001,volume),now+.014);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);osc.connect(gain);gain.connect(master);osc.start(now);osc.stop(now+duration+.03)}

function button(text,fn,cls=''){let b=document.createElement('button');b.textContent=text;b.className=cls;b.onclick=fn;return b}function show(title,body,build){mode='pause';overlay.classList.remove('hidden');panel.replaceChildren();let h=document.createElement('h1');h.textContent=title;let p=document.createElement('p');p.textContent=body;panel.append(h,p);if(build)build(panel)}function hide(){overlay.classList.add('hidden');mode='play'}function menu(){show('🐊 Captain Gator’s Halloween Quest','Six spooky worlds • triple-length levels, candy heals hearts, moving platforms, pumpkin-throwing enemies, crumbling bridges, spring pads, candy, and teacher mysteries!',p=>{let d=document.createElement('div');d.className='worlds';worlds.forEach((w,i)=>{let b=button(`${w[3]} WORLD ${i+1}\n${w[0]} ${i>unlocked?'🔒':''}`,()=>{world=i;level=0;start()},'');b.style.whiteSpace='pre-line';b.disabled=i>unlocked;d.append(b)});p.append(d);let note=document.createElement('p');note.className='note';note.textContent='NEW: Collect 10 candy to recover 1 heart (maximum 5). Every level is 3× longer, with more checkpoints, doors, ghosts, and hazards! Blue platforms move, cracked bridges collapse, green spring pads bounce you, and pumpkin monsters throw projectiles! Move with A/D or arrows, jump with Space, knock with E. iPad controls are on screen.';p.append(note)})}
function rand(n){let x=Math.sin(n*127.1+world*311.7+level*17.3)*43758.5453;return x-Math.floor(x)}function makeLevel(){hearts=5;candyTowardHeart=0;checkpoint=80;camera=0;player={x:80,y:290,vx:0,vy:0,ground:false,face:1};platforms=[];candies=[];ghosts=[];throwers=[];projectiles=[];doors=[];decor=[];particles=[];levelEnd=(3150+level*220)*3;platforms.push({x:-100,y:465,w:900,h:80});for(let x=800,i=0;x<levelEnd+350;x+=390,i++){let gap=level===0?85:105+level*17;platforms.push({x:x+gap,y:465,w:390-gap,h:80});if(i%2===0)platforms.push({x:x+130,y:355-(i%3)*24,w:155,h:18});if(i%3===1)platforms.push({x:x+25,y:290,w:105,h:18})}for(let x=180,i=0;x<levelEnd-80;x+=115,i++){let y=(i%5===0)?300:410-(i%4)*26;candies.push({x,y,taken:false,phase:rand(i)*7})}for(let x=620,i=0;x<levelEnd-160;x+=470,i++)ghosts.push({x,y:405,base:x,phase:i*2.1});for(let x=350,i=0;x<levelEnd-250;x+=700,i++)doors.push({x,y:375,done:false,id:world+'-'+level+'-'+i});// Dynamic hazards and routes are distributed across the entire level, not just the first screen.

const STAFF_MYSTERIES=[

function teacher(){
 const door=doors.find(d=>!d.done&&Math.abs(player.x-d.x)<95&&Math.abs(player.y-d.y)<130);
 if(!door)return;
 const correct=(world+level+Math.floor(door.x/700))%STAFF_MYSTERIES.length;
 const mystery=STAFF_MYSTERIES[correct];
 sound('knock');
 show('🚪 Knock, Knock!','You hear footsteps on the other side of the door…',p=>{
   const scene=document.createElement('div');scene.style.cssText='font-size:64px;margin:8px';scene.textContent='🚪 ✨';p.append(scene);
   p.append(button('🍬 TRICK OR TREAT!',()=>startTeacherGuess(door,mystery,correct)));
   p.append(button('Keep exploring',hide,'minor'));
 });
}
function startTeacherGuess(door,mystery,correct){
 let hint=0,tries=0;
 const seed=Math.floor(door.x)+world*1000+level*99;
 const shuffled=STAFF_MYSTERIES.map((s,i)=>({s,i,order:rand(seed+i*61)})).sort((a,b)=>a.order-b.order);
 function render(){
   show('🎭 Who Is Behind the Costume?',`“Happy Halloween! I'm dressed as ${mystery.costume}. Can you guess who I am?”`,p=>{
     const costume=document.createElement('div');costume.style.cssText='font-size:72px;line-height:1.3;margin:4px';costume.textContent=['🦸','🧙','🎃','🐉'][correct];p.append(costume);
     const clue=document.createElement('p');clue.style.cssText='font-weight:900;background:#ffffff14;border:1px solid #ffffff38;border-radius:14px;padding:12px';clue.textContent='🔎 CLUE '+(hint+1)+': '+mystery.clues[hint];p.append(clue);
     const choices=document.createElement('div');choices.className='teacher-choice';
     shuffled.forEach(o=>choices.append(button(o.s.role,()=>{
       if(o.i===correct){
         door.done=true;sound('correct');
         const prize=Math.max(10,30-tries*5-hint*3);
         awardCandy(prize);clueSet.add(door.id);save();ui();

           const photo=document.createElement('div');photo.style.cssText='font-size:60px';photo.textContent=mystery.emoji+' 🎉';p2.append(photo);
           const reward=document.createElement('p');reward.style.cssText='font-size:23px;color:#ffe18c;font-weight:900';reward.textContent='+'+prize+' CANDY!';p2.append(reward);
           const secret=document.createElement('p');secret.textContent='🔍 MYSTERY CLUE: '+mystery.secret;p2.append(secret);
           const note=document.createElement('p');note.className='note';note.textContent='Staff roles are placeholders until verified Gilbert staff names and approved photos are added.';p2.append(note);
           p2.append(button('Collect Candy & Continue →',hide));
         });
       }else{
         tries++;sound('wrong');

         const warning=document.createElement('p');warning.style.cssText='color:#ffce87;font-weight:bold';warning.textContent='Not quite! Here is another clue. Try again!';panel.insertBefore(warning,panel.lastChild);

function awardCandy(amount){const before=totalCandy;totalCandy+=amount;candyTowardHeart+=amount;let healed=0;while(candyTowardHeart>=10){candyTowardHeart-=10;if(hearts<5){hearts++;healed++}}if(healed){for(let j=0;j<14;j++)particles.push({x:player.x,y:player.y+15,vx:(rand(frame+j)-.5)*9,vy:-rand(frame+j+30)*8,life:38});}if(Math.floor(before/20)!==Math.floor(totalCandy/20))save();ui()}
function loseHeart(){if(invincible>0)return;sound('hurt');hearts--;invincible=105;ui();if(hearts<=0)show('👻 Boo! Try Again','Captain Gator ran out of hearts, but your collected candy and clues are safe.',p=>p.append(button('Retry from checkpoint',()=>{hearts=5;restart();ui()})));else{player.vy=-9;player.vx=-player.face*5}}
function finish(){sound('win');awardCandy(50);unlocked=Math.max(unlocked,Math.min(5,world+(level===2?1:0)));save();ui();show(level===2?'🏆 World Complete!':'⭐ Level Complete!',`Great jumping! You earned 50 bonus candy. ${level===2?'The next world is now unlocked!':'Ready for the next level?'}`,p=>{p.append(button(level===2?'Choose a world':'Next level →',()=>{if(level===2)menu();else{level++;start()}}));p.append(button('World Map',menu,'minor'))})}
function update(){
 if(mode!=='play')return;
 frame++;if(invincible>0)invincible--;
 for(const p of platforms){
   p.dx=0;
   if(p.kind==='moving'){let nx=p.base+Math.sin(frame*.022+p.phase)*p.range;p.dx=nx-p.x;p.x=nx}
   if(p.kind==='crumble'){
     if(p.timer>0){p.timer--;if(p.timer===0)p.broken=160}
     if(p.broken>0)p.broken--;
   }
 }
 let speed=keys.right?1:keys.left?-1:0;
 player.vx+=(speed*5.1-player.vx)*.18;if(speed)player.face=speed;
 if(keys.jump&&!jumpLatch&&player.ground){player.vy=-13.5;sound('jump');player.ground=false;jumpLatch=true}
 if(!keys.jump)jumpLatch=false;

     if(p.kind==='moving')player.x+=p.dx;
     if(p.kind==='crumble'&&!p.timer)p.timer=42;
     if(p.kind==='spring'){player.vy=-19.5;player.ground=false;sound('jump');for(let i=0;i<10;i++)particles.push({x:p.x+p.w/2,y:p.y,vx:(rand(frame+i)-.5)*8,vy:-rand(frame+i+11)*7,life:28})}
   }

 if(player.x<0)player.x=0;if(player.x>levelEnd-55){finish();return}
 if(player.x>checkpoint+600)checkpoint=Math.floor(player.x/650)*650+80;
 for(const c of candies){if(!c.taken&&Math.abs(c.x-player.x)<33&&Math.abs(c.y-player.y-24)<44){c.taken=true;sound('candy');awardCandy(1);for(let j=0;j<8;j++)particles.push({x:c.x,y:c.y,vx:(rand(frame+j)-.5)*7,vy:-rand(j+frame+1)*6,life:28})}}
 for(const g of ghosts){g.x=g.base+Math.sin(frame*.025+g.phase)*85;g.y=390+Math.sin(frame*.05+g.phase)*20;if(Math.abs(g.x-player.x)<34&&Math.abs(g.y-player.y-25)<45)loseHeart()}

   if(e.cooldown>0)e.cooldown--;
   if(e.cooldown<=0&&Math.abs(player.x-e.x)<650){
     let dir=player.x<e.x?-1:1;
     projectiles.push({x:e.x+dir*23,y:e.y-32,vx:dir*(3.3+level*.45),vy:-7.6,life:145,spin:0});
     e.cooldown=Math.max(75,145-world*5-level*8);
   }

   b.x+=b.vx;b.y+=b.vy;b.vy+=.19;b.spin+=.14;b.life--;

}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}function round(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function text(s,x,y,size,color='#fff',align='center'){ctx.font=`900 ${size}px Trebuchet MS, Arial`;ctx.textAlign=align;ctx.fillStyle=color;ctx.fillText(s,x,y)}function backdrop(){let w=worlds[world];let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,w[1]);grad.addColorStop(.8,'#24264e');grad.addColorStop(1,'#17132f');rect(0,0,W,H,grad);ellipse(780-(camera*.025)%120,104,61,61,'#ffe4a1');ellipse(800-(camera*.025)%120,85,60,61,w[1]);for(let i=0;i<26;i++){let x=(i*191+37-(camera*.12))%(W+100);if(x<0)x+=W+100;ellipse(x,50+rand(i+4)*230,2,2,'#fff0c5')}ctx.save();ctx.translate(-camera*.22,0);for(let x=-300;x<levelEnd+1000;x+=190){let h=125+rand(x+2)*95;rect(x,465-h,135,h,'#191b3b');for(let y=480-h;y<440;y+=32)for(let k=0;k<3;k++)round(x+14+k*39,y,16,19,3,'#f4ac6580');if(world===0){round(x-8,455-h,151,14,3,'#334c89')}else if(world===2){ellipse(x+60,380-h,92,75,'#182d4e');rect(x+45,360-h,28,160,'#182d4e')}else if(world===4){round(x+15,370-h,96,85,10,'#352349')}}ctx.restore();ctx.save();ctx.translate(-camera*.5,0);for(let x=-100;x<levelEnd+700;x+=340){if(world===1||world===2){rect(x+30,350,17,120,'#352647');ellipse(x+35,345,65,80,world===1?'#795079':'#2c6a69')}else if(world===3){round(x,345,95,120,20,'#a56c9b');text('🍬',x+48,410,55)}else if(world===0){round(x,310,155,160,5,'#344b7e');round(x+18,340,45,65,4,'#a8d3e1');round(x+88,340,45,65,4,'#a8d3e1')}else{rect(x,345,65,120,'#403157')}}ctx.restore()}
function drawPlatform(p){
 if(p.broken>0)return;
 if(p.kind==='moving'){
   round(p.x-4,p.y+9,p.w+8,15,7,'#172d59');round(p.x,p.y,p.w,17,8,'#45b9d1');
   for(let i=0;i<3;i++)text('◆',p.x+23+i*38,p.y+14,14,'#d9fcff');
   text('↔',p.x+p.w/2,p.y-10,22,'#fff2ac');return;
 }
 if(p.kind==='crumble'){
   round(p.x,p.y,p.w,p.h,4,p.timer?'#f17d52':'#bd9064');
   for(let i=1;i<5;i++)rect(p.x+i*25,p.y+3,2,11,'#50364c');
   text('!',p.x+p.w/2,p.y-8,19,'#ffe8a4');return;
 }
 if(p.kind==='spring'){
   round(p.x,p.y,p.w,p.h,5,'#1d6f68');round(p.x+5,p.y-7,p.w-10,10,5,'#c5ff9c');
   text('↑',p.x+p.w/2,p.y-17,24,'#fff4b8');return;
 }
 round(p.x,p.y,p.w,p.h,8,world===0?'#aab4c6':world===1?'#9d653f':world===2?'#665076':world===3?'#ce7caa':'#76617c');round(p.x,p.y,p.w,13,6,world===0?'#cfe4f2':world===1?'#80a95c':world===2?'#58a389':world===3?'#f9c3df':'#bba2bd');for(let x=p.x+22;x<p.x+p.w-10;x+=60)rect(x,p.y+28,3,25,'#ffffff24')
}
function drawThrower(e){
 ctx.save();ctx.translate(e.x,e.y);ctx.scale(e.face,1);
 ellipse(0,28,27,7,'#11132966');ellipse(0,0,27,30,'#d16c33');
 for(let i=-1;i<=1;i++)ellipse(i*12,0,10,27,i===0?'#f49a3d':'#e68131');
 round(-5,-36,10,12,3,'#3a8a55');ellipse(-10,-8,5,6,'#342340');ellipse(10,-8,5,6,'#342340');
 text('⌣',0,12,22,'#342340');round(-24,-44,48,9,5,'#392b62');
 ctx.restore();
 if(e.cooldown<35){text('!',e.x,e.y-58,29,'#fff0a8')}
}
function drawPumpkinShot(b){
 ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.spin);
 ellipse(0,0,13,13,'#f28a31');ellipse(-5,0,5,11,'#e3772c');ellipse(5,0,5,11,'#ffae4a');
 round(-2,-16,5,7,2,'#4caa61');ellipse(-4,-2,2,2,'#462b48');ellipse(4,-2,2,2,'#462b48');
 ctx.restore()
}
function drawGator(){let x=player.x,y=player.y;ctx.save();ctx.translate(x,y);ctx.scale(player.face,1);if(invincible>0&&frame%8<4)ctx.globalAlpha=.45;let bob=player.ground?Math.sin(frame*.2)*2:0;ctx.translate(0,bob);ellipse(0,52,25,6,'#10172b66');ctx.save();ctx.rotate(-.23);ellipse(29,27,36,13,'#2a8b54');ellipse(53,23,18,9,'#247648');ctx.restore();ellipse(-1,24,24,30,'#2d995b');ellipse(-1,29,15,20,'#a5d779');round(-20,43,15,11,5,'#226c4d');round(7,43,15,11,5,'#226c4d');ellipse(-8,1,23,23,'#37b96b');ellipse(-22,10,17,11,'#37b96b');ellipse(-23,13,14,6,'#d5eb91');ellipse(8,-14,8,13,'#37b96b');ellipse(-8,-14,8,13,'#37b96b');ellipse(8,-16,5,6,'#fff');ellipse(-8,-16,5,6,'#fff');ellipse(9,-16,2.3,3,'#162b35');ellipse(-7,-16,2.3,3,'#162b35');ellipse(-33,10,2.5,2,'#20573d');ellipse(-17,10,2.5,2,'#20573d');round(-25,-36,37,9,4,'#272347');round(-15,-48,20,17,3,'#3d346c');round(-18,-40,26,4,2,'#e5b953');ellipse(-12,19,5,4,'#eac36c');ctx.restore()}
function draw(){ctx.setTransform(1,0,0,1,0,0);rect(0,0,C.width,C.height,'#0c0e22');ctx.setTransform(scale,0,0,scale,ox,oy);backdrop();ctx.save();ctx.translate(-camera,0);for(const d of decor){if(d.x<camera-100||d.x>camera+W+100)continue;let y=450;if(d.type===0){ellipse(d.x,y,24,21,'#df7e35');text('◡',d.x,y+5,20,'#43213a')}else if(d.type===1){text('🕸',d.x,y-35,32)}else if(d.type===2){text('🍂',d.x,y-8,20)}else if(d.type===3){round(d.x-3,y-26,7,26,3,'#674d71');ellipse(d.x,y-28,15,12,'#ffd06a')}else text('✦',d.x,y-18,17,'#ffc778')}for(const p of platforms)if(p.x+p.w>camera-50&&p.x<camera+W+50)drawPlatform(p);for(const d of doors){if(d.x<camera-80||d.x>camera+W+80)continue;round(d.x-28,d.y-30,56,90,5,d.done?'#4b9e7c':'#9a5c68');round(d.x-21,d.y-22,42,75,3,'#4a3568');round(d.x-13,d.y-11,26,26,4,'#ffe4a8');ellipse(d.x+12,d.y+32,4,4,'#ffd26b');text(d.done?'✓':'?',d.x,d.y+7,23,'#61335d');if(!d.done&&Math.abs(player.x-d.x)<95&&Math.abs(player.y-d.y)<130){round(d.x-80,d.y-70,160,29,10,'#fff3ca');text('E / TREAT TO KNOCK',d.x,d.y-50,13,'#35254e')}}for(const c of candies)if(!c.taken&&c.x>camera-50&&c.x<camera+W+50){let y=c.y+Math.sin(frame*.06+c.phase)*5;ellipse(c.x,y,13,13,'#ffd062');ellipse(c.x,y,8,8,'#fff2a8');text('★',c.x,y+5,16,'#e89c36')}for(const g of ghosts){if(g.x<camera-80||g.x>camera+W+80)continue;let x=g.x,y=g.y;ellipse(x,y,23,25,'#e3f8f4');rect(x-22,y,44,16,'#e3f8f4');ellipse(x-15,y+15,8,10,'#e3f8f4');ellipse(x+15,y+15,8,10,'#e3f8f4');ellipse(x-8,y-2,4,6,'#35345d');ellipse(x+8,y-2,4,6,'#35345d');ellipse(x,y+9,5,4,'#bd75b7')}for(const e of throwers)if(e.x>camera-80&&e.x<camera+W+80)drawThrower(e);for(const b of projectiles)if(b.x>camera-40&&b.x<camera+W+40)drawPumpkinShot(b);for(const p of particles)ellipse(p.x,p.y,3,3,'#ffe87e');round(levelEnd-58,318,10,150,3,'#fff0b4');text('🏁',levelEnd-34,332,49);drawGator();ctx.restore();if(mode==='play'){text(`LEVEL ${level+1}/3`,W/2,45,21,'#ffe1a1');if(doors.some(d=>!d.done&&Math.abs(player.x-d.x)<95&&Math.abs(player.y-d.y)<130))text('🚪 KNOCK: E OR TREAT',W/2,85,17,'#fff5b4')}}
let last=0;function loop(t){let dt=Math.min(3,Math.max(1,Math.round((t-last)/16.67)||1));last=t;for(let i=0;i<dt;i++)update();draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();if(['ArrowLeft','KeyA'].includes(e.code))keys.left=true;if(['ArrowRight','KeyD'].includes(e.code))keys.right=true;if(['ArrowUp','Space','KeyW'].includes(e.code))keys.jump=true;if(e.code==='KeyE'&&mode==='play')teacher();if(e.code==='Escape'&&mode==='play')show('⏸ Paused','Take a candy break!',p=>{p.append(button('Resume',hide));p.append(button('World Map',menu,'minor'))})});addEventListener('keyup',e=>{if(['ArrowLeft','KeyA'].includes(e.code))keys.left=false;if(['ArrowRight','KeyD'].includes(e.code))keys.right=false;if(['ArrowUp','Space','KeyW'].includes(e.code))keys.jump=false});document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;for(const ev of ['pointerdown'])b.addEventListener(ev,e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,e=>{e.preventDefault();keys[k]=false})});document.getElementById('interact').onclick=()=>{if(mode==='play')teacher()};addEventListener('blur',()=>{keys.left=keys.right=keys.jump=false});ui();menu();})();
