<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Captain Gator's Halloween Quest</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#090d25;color:white;font-family:Trebuchet MS,Arial,sans-serif;overflow:hidden;touch-action:none}#game{display:block;width:100vw;height:100vh;object-fit:contain}#hud{position:fixed;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;gap:8px;font-weight:900;text-shadow:0 2px 6px #080719}#hud>div{background:#141333ba;border:2px solid #ffb95175;border-radius:18px;padding:9px 13px;backdrop-filter:blur(8px)}#hud small{color:#ffdca0;font-size:11px;display:block}#controls{position:fixed;bottom:15px;left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none}#controls button{pointer-events:auto;border:2px solid #ffe2a2;background:#30205ecb;color:white;border-radius:20px;font-size:26px;font-weight:900;width:68px;height:66px;box-shadow:0 5px 0 #130d2d;touch-action:none}#controls .jump{width:104px;background:#e78032dd}#controls .action{width:88px;background:#276b6bd9;font-size:18px}#controls .group{display:flex;gap:9px}#overlay{position:fixed;inset:0;background:#0c0c2ac9;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(7px)}#overlay.hidden{display:none}.panel{max-width:680px;width:100%;max-height:91vh;overflow:auto;background:linear-gradient(145deg,#26215b,#141333);border:3px solid #ffbd62;border-radius:27px;box-shadow:0 25px 80px #000b;padding:24px;text-align:center}.panel h1{font-size:clamp(30px,5vw,52px);line-height:1.06;margin:5px 0;color:#ffd66f;text-shadow:3px 4px #8a3a56}.panel p{line-height:1.5;color:#ece7ff}.panel button{background:linear-gradient(#ffdb7c,#f49a32);border:0;border-bottom:5px solid #a9511e;border-radius:15px;padding:13px 22px;margin:6px;font-weight:900;color:#282046;font-size:17px;cursor:pointer}.panel button:disabled{filter:grayscale(1);opacity:.45}.worlds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.worlds button{min-height:86px;padding:9px;font-size:14px}.panel .minor{background:#3e3c78;color:#fff;border-bottom-color:#1d1943}.teacher-choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}.teacher-choice button{font-size:15px}.note{font-size:12px!important;color:#d0c8ed!important}@media(max-width:530px){#hud{font-size:12px;top:5px;left:5px;right:5px}#hud>div{padding:6px 8px}.worlds{grid-template-columns:1fr 1fr}#controls button{width:58px;height:60px}.panel{padding:15px}}</style></head><body><canvas id="game"></canvas><div id="hud"><div><small>WORLD</small><span id="worldLabel">1-1 • Haunted School</span></div><div>🍬 <span id="candy">0</span> &nbsp; 💛 <span id="hearts">3</span></div><div><small>CLUES</small>🔎 <span id="clues">0</span>/6</div></div><div id="controls"><div class="group"><button data-key="left" aria-label="Move left">◀</button><button data-key="right" aria-label="Move right">▶</button></div><div class="group"><button class="action" id="interact">TREAT</button><button class="jump" data-key="jump">JUMP ↑</button></div></div><div id="overlay"><div class="panel" id="panel"></div></div><script>
(()=>{'use strict';const C=document.getElementById('game'),ctx=C.getContext('2d'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel');const W=960,H=540;let scale=1,ox=0,oy=0;function resize(){C.width=innerWidth*devicePixelRatio;C.height=innerHeight*devicePixelRatio;scale=Math.min(C.width/W,C.height/H);ox=(C.width-W*scale)/2;oy=(C.height-H*scale)/2}addEventListener('resize',resize);resize();
const worlds=[['Haunted School','#4b3a90','#ecab6c','🏫'],['Pumpkin Patch','#74427d','#ffc06c','🎃'],['Ghostly Forest','#263c73','#83c9c5','🌲'],['Candy Factory','#553a94','#ff8fc3','🍭'],['Haunted Castle','#352653','#c6a7ff','🏰'],['Golden Gator Rescue','#8c3b5a','#ffd476','🏆']];const storageKey='gilbert-gator-platformer-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch(e){}let unlocked=Math.max(0,Math.min(5,saved.unlocked||0)),totalCandy=saved.candy||0,clueSet=new Set(saved.clues||[]),world=0,level=0,mode='menu',camera=0,frame=0,hearts=3,checkpoint=80,invincible=0,ghosts=[],candies=[],platforms=[],doors=[],particles=[],decor=[],player={x:80,y:340,vx:0,vy:0,ground:false,face:1},keys={left:false,right:false,jump:false},jumpLatch=false,levelEnd=3100;function save(){try{localStorage.setItem(storageKey,JSON.stringify({unlocked,candy:totalCandy,clues:[...clueSet]}))}catch(e){}}function ui(){document.getElementById('worldLabel').textContent=`${world+1}-${level+1} • ${worlds[world][0]}`;document.getElementById('candy').textContent=totalCandy;document.getElementById('hearts').textContent=hearts;document.getElementById('clues').textContent=clueSet.size}
function button(text,fn,cls=''){let b=document.createElement('button');b.textContent=text;b.className=cls;b.onclick=fn;return b}function show(title,body,build){mode='pause';overlay.classList.remove('hidden');panel.replaceChildren();let h=document.createElement('h1');h.textContent=title;let p=document.createElement('p');p.textContent=body;panel.append(h,p);if(build)build(panel)}function hide(){overlay.classList.add('hidden');mode='play'}function menu(){show('🐊 Captain Gator’s Halloween Quest','Six spooky worlds • 18 platforming levels • candy, ghosts, teacher mysteries, and a Golden Gator rescue!',p=>{let d=document.createElement('div');d.className='worlds';worlds.forEach((w,i)=>{let b=button(`${w[3]} WORLD ${i+1}\n${w[0]} ${i>unlocked?'🔒':''}`,()=>{world=i;level=0;start()},'');b.style.whiteSpace='pre-line';b.disabled=i>unlocked;d.append(b)});p.append(d);let note=document.createElement('p');note.className='note';note.textContent='Keyboard: A/D or ←/→ to move, Space/↑ to jump, E to knock. On iPad, use the on-screen buttons. Progress saves on this device.';p.append(note)})}
function rand(n){let x=Math.sin(n*127.1+world*311.7+level*17.3)*43758.5453;return x-Math.floor(x)}function makeLevel(){hearts=3;checkpoint=80;camera=0;player={x:80,y:290,vx:0,vy:0,ground:false,face:1};platforms=[];candies=[];ghosts=[];doors=[];decor=[];particles=[];levelEnd=3150+level*220;platforms.push({x:-100,y:465,w:900,h:80});for(let x=800,i=0;x<levelEnd+350;x+=390,i++){let gap=level===0?85:105+level*17;platforms.push({x:x+gap,y:465,w:390-gap,h:80});if(i%2===0)platforms.push({x:x+130,y:355-(i%3)*24,w:155,h:18});if(i%3===1)platforms.push({x:x+25,y:290,w:105,h:18})}for(let x=180,i=0;x<levelEnd-80;x+=115,i++){let y=(i%5===0)?300:410-(i%4)*26;candies.push({x,y,taken:false,phase:rand(i)*7})}for(let x=620,i=0;x<levelEnd-160;x+=470,i++)ghosts.push({x,y:405,base:x,phase:i*2.1});for(let x=350,i=0;x<levelEnd-250;x+=700,i++)doors.push({x,y:375,done:false,id:world+'-'+level+'-'+i});for(let x=0,i=0;x<levelEnd+500;x+=130,i++)decor.push({x,type:Math.floor(rand(i+9)*5),size:rand(i+88)});ui()}
function start(){makeLevel();hide()}function restart(){player.x=checkpoint;player.y=230;player.vx=0;player.vy=0;invincible=90;hide()}
function teacher(){let door=doors.find(d=>!d.done&&Math.abs(player.x-d.x)<95&&Math.abs(player.y-d.y)<130);if(!door)return;let options=['The PE Coach','The Art Teacher','The Agriculture Teacher','The Media Specialist'];let correct=(world+level+Math.floor(door.x/700))%4;let answer=options[correct];let shuffled=options.map((t,i)=>({t,i})).sort((a,b)=>rand(door.x+a.i*33)-rand(door.x+b.i*33));show('🚪 Trick or Treat!','A Gilbert staff member is hiding in a Halloween costume! Which staff role is behind the mask?',p=>{let t=document.createElement('div');t.style.cssText='font-size:65px;padding:8px';t.textContent=['🧙','🦸','🧛','🤖','👻','🦖'][Math.floor(door.x/700)%6];p.append(t);let choices=document.createElement('div');choices.className='teacher-choice';shuffled.forEach(o=>choices.append(button(o.t,()=>{if(o.i===correct){door.done=true;totalCandy+=20;clueSet.add(door.id);save();ui();show('🎉 Mystery Solved!',`${answer} was behind the costume! +20 candy and a Golden Gator clue.`,q=>q.append(button('Keep exploring!',hide)))}else{show('Almost! 🎃','Try another guess! The teacher is still waiting.',q=>q.append(button('Try again',teacher)))}})));p.append(choices);let note=document.createElement('p');note.className='note';note.textContent='Demo staff roles only. Real teacher names and approved photographs can be added later; no identities are invented.';p.append(note)})}
function loseHeart(){if(invincible>0)return;hearts--;invincible=105;ui();if(hearts<=0)show('👻 Boo! Try Again','Captain Gator ran out of hearts, but your collected candy and clues are safe.',p=>p.append(button('Retry from checkpoint',()=>{hearts=3;restart();ui()})));else{player.vy=-9;player.vx=-player.face*5}}
function finish(){totalCandy+=50;unlocked=Math.max(unlocked,Math.min(5,world+(level===2?1:0)));save();ui();show(level===2?'🏆 World Complete!':'⭐ Level Complete!',`Great jumping! You earned 50 bonus candy. ${level===2?'The next world is now unlocked!':'Ready for the next level?'}`,p=>{p.append(button(level===2?'Choose a world':'Next level →',()=>{if(level===2)menu();else{level++;start()}}));p.append(button('World Map',menu,'minor'))})}
function update(){if(mode!=='play')return;frame++;if(invincible>0)invincible--;let speed=keys.right?1:keys.left?-1:0;player.vx+=(speed*5.1-player.vx)*.18;if(speed)player.face=speed;if(keys.jump&&!jumpLatch&&player.ground){player.vy=-13.5;player.ground=false;jumpLatch=true}if(!keys.jump)jumpLatch=false;let oldBottom=player.y+52;player.vy=Math.min(14,player.vy+.65);player.x+=player.vx;player.y+=player.vy;player.ground=false;for(const p of platforms){if(player.x+24>p.x&&player.x-24<p.x+p.w&&oldBottom<=p.y+8&&player.y+52>=p.y&&player.vy>=0){player.y=p.y-52;player.vy=0;player.ground=true}}if(player.y>H+130){loseHeart();player.x=checkpoint;player.y=150;player.vy=0}if(player.x<0)player.x=0;if(player.x>levelEnd-55)finish();if(player.x>checkpoint+600)checkpoint=Math.floor(player.x/650)*650+80;for(const c of candies){if(!c.taken&&Math.abs(c.x-player.x)<33&&Math.abs(c.y-player.y-24)<44){c.taken=true;totalCandy++;if(totalCandy%20===0)save();ui();for(let j=0;j<8;j++)particles.push({x:c.x,y:c.y,vx:(rand(frame+j)-.5)*7,vy:-rand(j+frame+1)*6,life:28})}}for(const g of ghosts){g.x=g.base+Math.sin(frame*.025+g.phase)*85;g.y=390+Math.sin(frame*.05+g.phase)*20;if(Math.abs(g.x-player.x)<34&&Math.abs(g.y-player.y-25)<45)loseHeart()}for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life--}particles=particles.filter(p=>p.life>0);camera+=(Math.max(0,Math.min(levelEnd-W,player.x-300))-camera)*.09}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}function round(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function text(s,x,y,size,color='#fff',align='center'){ctx.font=`900 ${size}px Trebuchet MS, Arial`;ctx.textAlign=align;ctx.fillStyle=color;ctx.fillText(s,x,y)}function backdrop(){let w=worlds[world];let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,w[1]);grad.addColorStop(.8,'#24264e');grad.addColorStop(1,'#17132f');rect(0,0,W,H,grad);ellipse(780-(camera*.025)%120,104,61,61,'#ffe4a1');ellipse(800-(camera*.025)%120,85,60,61,w[1]);for(let i=0;i<26;i++){let x=(i*191+37-(camera*.12))%(W+100);if(x<0)x+=W+100;ellipse(x,50+rand(i+4)*230,2,2,'#fff0c5')}ctx.save();ctx.translate(-camera*.22,0);for(let x=-300;x<levelEnd+1000;x+=190){let h=125+rand(x+2)*95;rect(x,465-h,135,h,'#191b3b');for(let y=480-h;y<440;y+=32)for(let k=0;k<3;k++)round(x+14+k*39,y,16,19,3,'#f4ac6580');if(world===0){round(x-8,455-h,151,14,3,'#334c89')}else if(world===2){ellipse(x+60,380-h,92,75,'#182d4e');rect(x+45,360-h,28,160,'#182d4e')}else if(world===4){round(x+15,370-h,96,85,10,'#352349')}}ctx.restore();ctx.save();ctx.translate(-camera*.5,0);for(let x=-100;x<levelEnd+700;x+=340){if(world===1||world===2){rect(x+30,350,17,120,'#352647');ellipse(x+35,345,65,80,world===1?'#795079':'#2c6a69')}else if(world===3){round(x,345,95,120,20,'#a56c9b');text('🍬',x+48,410,55)}else if(world===0){round(x,310,155,160,5,'#344b7e');round(x+18,340,45,65,4,'#a8d3e1');round(x+88,340,45,65,4,'#a8d3e1')}else{rect(x,345,65,120,'#403157')}}ctx.restore()}
function drawPlatform(p){round(p.x,p.y,p.w,p.h,8,world===0?'#aab4c6':world===1?'#9d653f':world===2?'#665076':world===3?'#ce7caa':'#76617c');round(p.x,p.y,p.w,13,6,world===0?'#cfe4f2':world===1?'#80a95c':world===2?'#58a389':world===3?'#f9c3df':'#bba2bd');for(let x=p.x+22;x<p.x+p.w-10;x+=60)rect(x,p.y+28,3,25,'#ffffff24')}
function drawGator(){let x=player.x,y=player.y;ctx.save();ctx.translate(x,y);ctx.scale(player.face,1);if(invincible>0&&frame%8<4)ctx.globalAlpha=.45;let bob=player.ground?Math.sin(frame*.2)*2:0;ctx.translate(0,bob);ellipse(0,52,25,6,'#10172b66');ctx.save();ctx.rotate(-.23);ellipse(29,27,36,13,'#2a8b54');ellipse(53,23,18,9,'#247648');ctx.restore();ellipse(-1,24,24,30,'#2d995b');ellipse(-1,29,15,20,'#a5d779');round(-20,43,15,11,5,'#226c4d');round(7,43,15,11,5,'#226c4d');ellipse(-8,1,23,23,'#37b96b');ellipse(-22,10,17,11,'#37b96b');ellipse(-23,13,14,6,'#d5eb91');ellipse(8,-14,8,13,'#37b96b');ellipse(-8,-14,8,13,'#37b96b');ellipse(8,-16,5,6,'#fff');ellipse(-8,-16,5,6,'#fff');ellipse(9,-16,2.3,3,'#162b35');ellipse(-7,-16,2.3,3,'#162b35');ellipse(-33,10,2.5,2,'#20573d');ellipse(-17,10,2.5,2,'#20573d');round(-25,-36,37,9,4,'#272347');round(-15,-48,20,17,3,'#3d346c');round(-18,-40,26,4,2,'#e5b953');ellipse(-12,19,5,4,'#eac36c');ctx.restore()}
function draw(){ctx.setTransform(1,0,0,1,0,0);rect(0,0,C.width,C.height,'#0c0e22');ctx.setTransform(scale,0,0,scale,ox,oy);backdrop();ctx.save();ctx.translate(-camera,0);for(const d of decor){if(d.x<camera-100||d.x>camera+W+100)continue;let y=450;if(d.type===0){ellipse(d.x,y,24,21,'#df7e35');text('◡',d.x,y+5,20,'#43213a')}else if(d.type===1){text('🕸',d.x,y-35,32)}else if(d.type===2){text('🍂',d.x,y-8,20)}else if(d.type===3){round(d.x-3,y-26,7,26,3,'#674d71');ellipse(d.x,y-28,15,12,'#ffd06a')}else text('✦',d.x,y-18,17,'#ffc778')}for(const p of platforms)if(p.x+p.w>camera-50&&p.x<camera+W+50)drawPlatform(p);for(const d of doors){if(d.x<camera-80||d.x>camera+W+80)continue;round(d.x-28,d.y-30,56,90,5,d.done?'#4b9e7c':'#9a5c68');round(d.x-21,d.y-22,42,75,3,'#4a3568');round(d.x-13,d.y-11,26,26,4,'#ffe4a8');ellipse(d.x+12,d.y+32,4,4,'#ffd26b');text(d.done?'✓':'?',d.x,d.y+7,23,'#61335d');if(!d.done&&Math.abs(player.x-d.x)<95&&Math.abs(player.y-d.y)<130){round(d.x-80,d.y-70,160,29,10,'#fff3ca');text('E / TREAT TO KNOCK',d.x,d.y-50,13,'#35254e')}}for(const c of candies)if(!c.taken&&c.x>camera-50&&c.x<camera+W+50){let y=c.y+Math.sin(frame*.06+c.phase)*5;ellipse(c.x,y,13,13,'#ffd062');ellipse(c.x,y,8,8,'#fff2a8');text('★',c.x,y+5,16,'#e89c36')}for(const g of ghosts){if(g.x<camera-80||g.x>camera+W+80)continue;let x=g.x,y=g.y;ellipse(x,y,23,25,'#e3f8f4');rect(x-22,y,44,16,'#e3f8f4');ellipse(x-15,y+15,8,10,'#e3f8f4');ellipse(x+15,y+15,8,10,'#e3f8f4');ellipse(x-8,y-2,4,6,'#35345d');ellipse(x+8,y-2,4,6,'#35345d');ellipse(x,y+9,5,4,'#bd75b7')}for(const p of particles)ellipse(p.x,p.y,3,3,'#ffe87e');round(levelEnd-58,318,10,150,3,'#fff0b4');text('🏁',levelEnd-34,332,49);drawGator();ctx.restore();if(mode==='play'){text(`LEVEL ${level+1}/3`,W/2,45,21,'#ffe1a1');if(doors.some(d=>!d.done&&Math.abs(player.x-d.x)<95&&Math.abs(player.y-d.y)<130))text('🚪 KNOCK: E OR TREAT',W/2,85,17,'#fff5b4')}}
let last=0;function loop(t){let dt=Math.min(3,Math.max(1,Math.round((t-last)/16.67)||1));last=t;for(let i=0;i<dt;i++)update();draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();if(['ArrowLeft','KeyA'].includes(e.code))keys.left=true;if(['ArrowRight','KeyD'].includes(e.code))keys.right=true;if(['ArrowUp','Space','KeyW'].includes(e.code))keys.jump=true;if(e.code==='KeyE'&&mode==='play')teacher();if(e.code==='Escape'&&mode==='play')show('⏸ Paused','Take a candy break!',p=>{p.append(button('Resume',hide));p.append(button('World Map',menu,'minor'))})});addEventListener('keyup',e=>{if(['ArrowLeft','KeyA'].includes(e.code))keys.left=false;if(['ArrowRight','KeyD'].includes(e.code))keys.right=false;if(['ArrowUp','Space','KeyW'].includes(e.code))keys.jump=false});document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;for(const ev of ['pointerdown'])b.addEventListener(ev,e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,e=>{e.preventDefault();keys[k]=false})});document.getElementById('interact').onclick=()=>{if(mode==='play')teacher()};addEventListener('blur',()=>{keys.left=keys.right=keys.jump=false});ui();menu();})();
</script></body></html>
