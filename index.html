function makeLevel(){boss=null;hearts=5;candyTowardHeart=0;checkpoint=80;camera=0;jumpsUsed=0;jumpLatch=false;player={x:80,y:290,vx:0,vy:0,ground:false,face:1};platforms=[];candies=[];ghosts=[];witches=[];zombies=[];monsters=[];throwers=[];projectiles=[];doors=[];decor=[];particles=[];levelEnd=(3150+level*220)*3;if(world===5&&level===2){boss={x:levelEnd-265,y:382,hits:0,inv:0,attack:95,phase:0,defeated:false};}platforms.push({x:-100,y:465,w:900,h:80});

function startTeacherGuess(door,mystery,correct){

function draw(){ctx.setTransform(1,0,0,1,0,0);rect(0,0,C.width,C.height,'#0c0e22');ctx.setTransform(scale,0,0,scale,ox,oy);backdrop();ctx.save();ctx.translate(-camera,0);for(const d of decor){if(d.x<camera-100||d.x>camera+W+100)continue;let y=450;if(d.type===0){ellipse(d.x,y,24,21,'#df7e35');text('◡',d.x,y+5,20,'#43213a')}else if(d.type===1){text('🕸',d.x,y-35,32)}else if(d.type===2){text('🍂',d.x,y-8,20)}else if(d.type===3){round(d.x-3,y-26,7,26,3,'#674d71');ellipse(d.x,y-28,15,12,'#ffd06a')}else text('✦',d.x,y-18,17,'#ffc778')}for(const p of platforms)if(p.x+p.w>camera-50&&p.x<camera+W+50)drawPlatform(p);for(const d of doors){if(d.x<camera-80||d.x>camera+W+80)continue;round(d.x-28,d.y-30,56,90,5,d.done?'#4b9e7c':'#9a5c68');round(d.x-21,d.y-22,42,75,3,'#4a3568');round(d.x-13,d.y-11,26,26,4,'#ffe4a8');ellipse(d.x+12,d.y+32,4,4,'#ffd26b');text(d.done?'✓':'?',d.x,d.y+7,23,'#61335d');if(!d.done&&Math.abs(player.x-d.x)<95&&Math.abs(player.y-d.y)<130){round(d.x-80,d.y-70,160,29,10,'#fff3ca');text('E / TREAT TO KNOCK',d.x,d.y-50,13,'#35254e')}}for(const c of candies)if(!c.taken&&c.x>camera-50&&c.x<camera+W+50){let y=c.y+Math.sin(frame*.06+c.phase)*5;ellipse(c.x,y,13,13,'#ffd062');ellipse(c.x,y,8,8,'#fff2a8');text('★',c.x,y+5,16,'#e89c36')}for(const g of ghosts){if(boss&&g.x>levelEnd-820)continue;if(g.x<camera-80||g.x>camera+W+80)continue;let x=g.x,y=g.y;ellipse(x,y,23,25,'#e3f8f4');rect(x-22,y,44,16,'#e3f8f4');ellipse(x-15,y+15,8,10,'#e3f8f4');ellipse(x+15,y+15,8,10,'#e3f8f4');ellipse(x-8,y-2,4,6,'#35345d');ellipse(x+8,y-2,4,6,'#35345d');ellipse(x,y+9,5,4,'#bd75b7')}for(const w of witches)if(w.alive&&w.x>camera-100&&w.x<camera+W+100&&(!boss||w.x<levelEnd-850)&&!doors.some(d=>Math.abs(w.x-d.x)<280))drawWitch(w);for(const z of zombies)if(z.alive&&z.x>camera-80&&z.x<camera+W+80&&(!boss||z.x<levelEnd-850)&&!doors.some(d=>Math.abs(z.x-d.x)<250))drawZombie(z);for(const m of monsters)if(m.alive&&m.x>camera-90&&m.x<camera+W+90&&!doors.some(d=>Math.abs(m.x-d.x)<250))drawMonster(m);for(const e of throwers)if((!boss||e.x<levelEnd-820)&&e.x>camera-80&&e.x<camera+W+80)drawThrower(e);for(const b of projectiles)if(b.x>camera-40&&b.x<camera+W+40)drawPumpkinShot(b);for(const p of particles)ellipse(p.x,p.y,3,3,'#ffe87e');drawBoss();round(levelEnd-58,318,10,150,3,'#fff0b4');text('🏁',levelEnd-34,332,49);drawGator();ctx.restore();weatherOverlay();if(mode==='play'){text(`LEVEL ${level+1}/3 • ${currentWeather().toUpperCase()}`,W/2,45,21,'#ffe1a1');if(doors.some(d=>!d.done&&Math.abs(player.x-d.x)<95&&Math.abs(player.y-d.y)<130))text('🚪 KNOCK: E OR TREAT',W/2,85,17,'#fff5b4')}}
let last=0;function loop(t){let dt=Math.min(3,Math.max(1,Math.round((t-last)/16.67)||1));last=t;for(let i=0;i<dt;i++)update();draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();if(['ArrowLeft','KeyA'].includes(e.code))keys.left=true;if(['ArrowRight','KeyD'].includes(e.code))keys.right=true;if(['ArrowUp','Space','KeyW'].includes(e.code))keys.jump=true;if(e.code==='KeyE'&&mode==='play')teacher();if(e.code==='Escape'&&mode==='play')show('⏸ Paused','Take a candy break!',p=>{p.append(button('Resume',hide));p.append(button('World Map',menu,'minor'))})});addEventListener('keyup',e=>{if(['ArrowLeft','KeyA'].includes(e.code))keys.left=false;if(['ArrowRight','KeyD'].includes(e.code))keys.right=false;if(['ArrowUp','Space','KeyW'].includes(e.code))keys.jump=false});document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;for(const ev of ['pointerdown'])b.addEventListener(ev,e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,e=>{e.preventDefault();keys[k]=false})});document.getElementById('interact').onclick=()=>{if(mode==='play')teacher()};addEventListener('blur',()=>{keys.left=keys.right=keys.jump=false});ui();menu();})();
</script></body></html>
