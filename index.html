<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gilbert Gators — Who's Behind the Mask?</title><style>*{box-sizing:border-box}body{margin:0;background:#10051f;color:white;font-family:Trebuchet MS,Arial,sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:12px}.game{width:min(100%,1536px);position:relative;aspect-ratio:3/2;background:#1b0d2c url('map.png') center/100% 100% no-repeat;border:3px solid #a24df1;border-radius:18px;box-shadow:0 0 60px #7e36bd80;overflow:hidden}.hotspot{position:absolute;border:2px solid transparent;background:transparent;cursor:pointer;border-radius:16px}.hotspot:hover,.hotspot:focus-visible{border-color:#ffcf4a;background:#ffbb0028;box-shadow:0 0 18px #ffb900;outline:0}.panel{position:absolute;inset:0;background:#100720d9;display:grid;place-items:center;padding:16px;z-index:5}.panel[hidden]{display:none}.dialog{background:linear-gradient(145deg,#3b165d,#1d0c35);border:3px solid #f7a832;box-shadow:0 0 45px #000;max-width:540px;width:100%;border-radius:20px;padding:24px;text-align:center}.dialog h1{font-size:clamp(22px,3vw,38px);color:#ffcf4a;margin:0 0 10px}.dialog p{line-height:1.5}.btn{background:linear-gradient(#ffcf42,#ef6c14);border:0;border-radius:12px;padding:13px 22px;font-size:18px;font-weight:bold;color:#21102d;cursor:pointer;margin:6px}.btn:hover{filter:brightness(1.15)}.option{display:block;width:100%;background:#552577;color:white;border:2px solid #b26af0;padding:12px;margin:9px 0;border-radius:12px;cursor:pointer;font-size:17px}.option:hover{background:#7540a1}.status{position:absolute;bottom:1%;left:34%;background:#1e0b38dc;padding:10px 16px;border:2px solid #ffb73e;border-radius:16px;font-size:clamp(12px,1.5vw,20px)}.toast{color:#ffd56b;font-weight:bold}.top{position:absolute;top:1%;right:1%;background:#250d43e8;border-radius:12px;padding:9px;font-weight:bold}small{color:#e5c7ff}@media(max-width:650px){.game{aspect-ratio:3/2}.status{left:20%;font-size:11px;padding:5px}.top{font-size:11px;padding:4px}.dialog{padding:14px}.dialog p{font-size:14px}.option{padding:8px;font-size:14px}}</style></head><body><main><section class="game" aria-label="Interactive haunted Gilbert Elementary map"><div class="top" id="counter">🍬 0 · 🎭 0 discovered</div><div class="status" id="status">Choose a location to trick-or-treat!</div><div id="hotspots"></div><div class="panel" id="panel"><div class="dialog" id="dialog"></div></div></section></main><script>
const places=[['Forest',46,18,13,17],['Playground',72,24,21,20],['Gym',46,32,17,16],['Art Room',23,34,16,15],['Ag Room',3,34,19,15],['5th Grade',4,48,18,14],['4th Grade',23,48,17,14],['3rd Grade',39,48,15,14],['2nd Grade',54,48,14,14],['1st Grade',69,48,14,14],['Kindergarten',82,48,16,14],['Library',4,65,19,15],['Office',66,65,15,15],['Cafeteria',82,65,17,15],['Front Entrance',39,66,24,19]];
const characters=[{name:'The Librarian',hint:'This person helps students find wonderful books.'},{name:'The PE Teacher',hint:'This person helps students exercise and play games.'},{name:'The Art Teacher',hint:'This person helps students make colorful creations.'},{name:'The Principal',hint:'This person helps lead the school.'}];
const storage='gilbert-halloween-stage1';let state;try{state=JSON.parse(localStorage.getItem(storage))||{candy:0,found:[]}}catch{state={candy:0,found:[]}};const panel=document.getElementById('panel'),dialog=document.getElementById('dialog');function save(){localStorage.setItem(storage,JSON.stringify(state));document.getElementById('counter').textContent=`🍬 ${state.candy} · 🎭 ${state.found.length} discovered`};function show(html){dialog.innerHTML=html;panel.hidden=false;panel.style.display="grid"};function closePanel(){panel.hidden=true;panel.style.display="none";document.getElementById("status").textContent="Click a school location to trick-or-treat!"};function intro(){show('<h1>🎃 Who’s Behind the Mask?</h1><p>Welcome to Gilbert Elementary’s Halloween adventure! Explore the school, knock on doors, solve staff mysteries, and fill your candy bucket.</p><p><small>Stage 1 preview: sample staff roles are placeholders. Actual staff names and approved artwork will be added later.</small></p><button class="btn" onclick="closePanel()">🐊 Start Exploring</button>')};function visit(place){const id=places.findIndex(p=>p[0]===place);const c=characters[id%characters.length];const completed=state.found.includes(place);show(`<h1>🎃 ${place}</h1><p>🚪 Knock knock! A mysterious costumed staff member answers the door.</p><p>👻 <strong>Clue:</strong> ${c.hint}</p>${completed?'<p class="toast">Already discovered! 🍬</p>':characters.map((x,i)=>`<button class="option" onclick="guess(${id},${i})">${x.name}</button>`).join('')}<button class="btn" onclick="closePanel()">← Back to Map</button>`)}function guess(id,i){const place=places[id][0],correct=id%characters.length===i;if(correct){if(!state.found.includes(place)){state.found.push(place);state.candy+=25;save()}show(`<h1>🎉 You got it!</h1><p>You discovered the mystery staff role at <strong>${place}</strong>!</p><p class="toast">🍬 +25 candy!</p><button class="btn" onclick="closePanel()">Keep Exploring</button>`)}else{show(`<h1>👻 Not quite!</h1><p>Try another guess. You can do it!</p><button class="btn" onclick="visit('${place.replace(/'/g,"\\'")}')">Try Again</button>`)} };
for(const [name,x,y,w,h] of places){const b=document.createElement('button');b.className='hotspot';b.style.cssText=`left:${x}%;top:${y}%;width:${w}%;height:${h}%`;b.title=`Explore ${name}`;b.setAttribute('aria-label',`Explore ${name}`);b.onclick=()=>visit(name);document.getElementById('hotspots').append(b)}save();intro();
</script></body></html>
